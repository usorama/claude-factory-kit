# Candidate exact model IDs per tool, newest first inside each family. Never a moving alias.
# `factory init` (and `factory probe`) makes one tiny call per candidate and keeps the ones that answer.
# Add new IDs here when a maker releases them; the probe decides what this machine can use.

[claude]
probe = ["claude", "-p", "--model", "{model}", "--output-format", "json", "--no-session-persistence", "--max-turns", "1"]
output = "claude-json"
candidates = ["claude-fable-5-1", "claude-fable-5", "claude-opus-5-5", "claude-opus-5", "claude-opus-4-8",
              "claude-sonnet-5-5", "claude-sonnet-5", "claude-sonnet-4-6", "claude-haiku-5", "claude-haiku-4-5"]

[codex]
probe = ["codex", "exec", "-m", "{model}", "--ephemeral", "--json", "-s", "read-only", "--skip-git-repo-check", "-"]
output = "codex-jsonl"
candidates = ["gpt-6-sol", "gpt-6-astra", "gpt-6-luna"]
