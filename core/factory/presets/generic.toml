# Preset generic: any harness. Put your commands here. A command gets the prompt on stdin, runs in the
# A command gets the prompt on stdin, runs in the unit work folder and must pass {model}.
# The reviewer writes its form to $FACTORY_REVIEW_FORM. Fill in every <...>.
# Role requirements, not model names: `factory init` probes the exact models this machine can use
# and writes them into the project's factory.toml with a fixed rule (see core/probe.py).
preset = "generic"

[settings]
max_turns_build = 40
max_turns_review = 30
crew_max_turns = 20

[expected_usd]
measured = "unknown for your harness; costs count only when a command reports total_cost_usd"

[roles.chief-of-staff]
tool = "other"
model = "<model>"
effort = "high"
prompt = ".ai/prompts/chief-of-staff.v1.md"
form = "position"
check = "consistency"
tools = []

[roles.builder]
tool = "other"
model = "<builder-model>"
effort = "medium"
prompt = ".ai/prompts/builder.v1.md"
form = "diff"
check = "build_check"
output = "text"
tools = []
command = ["<your-builder-command>", "--model", "{model}"]

[roles.reviewer]
tool = "other"
model = "<reviewer-model>"
effort = "high"
prompt = ".ai/prompts/inspector-grumble.v1.md"
form = "review-json"
check = "review_form"
output = "text"
tools = []
command = ["<your-reviewer-command>", "--model", "{model}"]

[roles.researcher]
tool = "other"
model = "<model>"
effort = "high"
prompt = ".ai/prompts/researcher.v1.md"
form = "research-md"
check = "research_check"
tools = []

[roles.summarizer]
tool = "other"
model = "<model>"
effort = "low"
prompt = ".ai/prompts/summarizer.v1.md"
form = "summary-md"
check = "summary_check"
tools = []
