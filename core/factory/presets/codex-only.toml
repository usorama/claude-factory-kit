# Preset codex-only: Codex only, no Claude needed. Two different Codex models build and review when available.
# Role requirements, not model names: `factory init` probes the exact models this machine can use
# and writes them into the project's factory.toml with a fixed rule (see core/probe.py).
preset = "codex-only"

[settings]
max_turns_build = 40
max_turns_review = 30
crew_max_turns = 20

[expected_usd]
measured = "Codex reports tokens, not dollars: the daily dollar budget cannot apply; watch your plan's limits"

[roles.chief-of-staff]
tool = "codex"
tier = "strong"
prefer = ["gpt-6-astra", "gpt-6-sol"]
effort = "high"
prompt = ".ai/prompts/chief-of-staff.v1.md"
form = "position"
check = "consistency"
tools = ["workspace-write"]

[roles.builder]
tool = "codex"
tier = "strong"
prefer = ["gpt-6-sol", "gpt-6-astra"]
effort = "medium"
prompt = ".ai/prompts/builder.v1.md"
form = "diff"
check = "build_check"
output = "codex-jsonl"
tools = ["workspace-write"]
command = ["codex", "exec", "-m", "{model}", "-c", "model_reasoning_effort=\"{effort}\"", "-s", "{tools}", "--ephemeral", "--json", "-"]

[roles.reviewer]
tool = "codex"
tier = "strong"
prefer = ["gpt-6-astra", "gpt-6-sol"]
effort = "high"
prompt = ".ai/prompts/inspector-grumble.v1.md"
form = "review-json"
check = "review_form"
output = "codex-jsonl"
tools = ["workspace-write"]
command = ["codex", "exec", "-m", "{model}", "-c", "model_reasoning_effort=\"{effort}\"", "-s", "{tools}", "--ephemeral", "--json", "-"]

[roles.researcher]
tool = "codex"
tier = "strong"
prefer = ["gpt-6-astra", "gpt-6-sol"]
effort = "high"
prompt = ".ai/prompts/researcher.v1.md"
form = "research-md"
check = "research_check"
tools = ["workspace-write"]

[roles.summarizer]
tool = "codex"
tier = "fast"
prefer = ["gpt-6-luna", "gpt-6-sol"]
effort = "low"
prompt = ".ai/prompts/summarizer.v1.md"
form = "summary-md"
check = "summary_check"
tools = ["read-only"]
