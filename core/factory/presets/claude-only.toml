# Preset claude-only (the zero-config default): Claude only. A Sonnet builds; Opus reviews when this machine has it, else another Sonnet version.
# Role requirements, not model names: `factory init` probes the exact models this machine can use
# and writes them into the project's factory.toml with a fixed rule (see core/probe.py).
preset = "claude-only"

[settings]
max_budget_build_usd = 1.0
max_budget_review_usd = 1.5
max_budget_crew_usd = 0.75
daily_budget_usd = 15.0
max_turns_build = 40
max_turns_review = 30
crew_max_turns = 20

[expected_usd]
build = 0.16
review = 0.38
crew_per_row = 0.61
measured = "2026-10-07, Claude Code 2.1.290: builder claude-sonnet-5-5 (medium), reviewer claude-opus-5-5 (high), crew on those two"

[roles.chief-of-staff]
tool = "claude"
tier = "strong"
prefer = ["opus", "fable", "sonnet"]
effort = "high"
prompt = ".ai/prompts/chief-of-staff.v1.md"
form = "position"
check = "consistency"
tools = ["Read", "Edit", "Write", "Glob", "Grep", "Bash"]

[roles.builder]
tool = "claude"
tier = "strong"
prefer = ["sonnet", "opus", "fable"]
effort = "medium"
prompt = ".ai/prompts/builder.v1.md"
form = "diff"
check = "build_check"
output = "claude-json"
tools = ["Read", "Edit", "Write", "Glob", "Grep", "Bash(git diff *)", "Bash(git status *)", "Bash(ls *)", "Bash(git log *)", "Bash(git show *)", "Bash(cp *)", "Bash(mkdir *)", "Bash(python3 -m pytest *)", "Bash(python3 -B -m pytest *)", "Bash(pytest *)"]
command = ["claude", "-p", "--model", "{model}", "--effort", "{effort}", "--output-format", "json", "--no-session-persistence", "--permission-mode", "dontAsk", "--settings", "{no_network}", "--max-turns", "{max_turns}", "--max-budget-usd", "{max_budget}", "--allowedTools", "{tools}", "--disallowedTools", "{deny}"]
deny = ["Bash(git push *)", "Bash(git commit *)", "Bash(git reset *)", "Bash(curl *)", "Bash(wget *)", "WebFetch", "WebSearch"]

[roles.reviewer]
tool = "claude"
tier = "strong"
prefer = ["opus", "fable", "sonnet"]
effort = "high"
prompt = ".ai/prompts/inspector-grumble.v1.md"
form = "review-json"
check = "review_form"
output = "claude-json"
tools = ["Read", "Edit", "Write", "Glob", "Grep", "Bash(git diff *)", "Bash(git status *)", "Bash(ls *)", "Bash(git log *)", "Bash(git show *)", "Bash(cp *)", "Bash(mkdir *)", "Bash(python3 -m pytest *)", "Bash(python3 -B -m pytest *)", "Bash(pytest *)"]
command = ["claude", "-p", "--model", "{model}", "--effort", "{effort}", "--output-format", "json", "--no-session-persistence", "--permission-mode", "dontAsk", "--settings", "{no_network}", "--max-turns", "{max_turns}", "--max-budget-usd", "{max_budget}", "--allowedTools", "{tools}", "--disallowedTools", "{deny}"]
deny = ["Bash(git push *)", "Bash(git commit *)", "Bash(git reset *)", "Bash(curl *)", "Bash(wget *)", "WebFetch", "WebSearch"]

[roles.researcher]
tool = "claude"
tier = "strong"
prefer = ["opus", "fable", "sonnet"]
effort = "high"
prompt = ".ai/prompts/researcher.v1.md"
form = "research-md"
check = "research_check"
tools = ["Read", "Glob", "Grep", "Bash", "WebFetch", "WebSearch", "Write"]

[roles.summarizer]
tool = "claude"
tier = "fast"
prefer = ["haiku", "sonnet"]
effort = "low"
prompt = ".ai/prompts/summarizer.v1.md"
form = "summary-md"
check = "summary_check"
tools = ["Read"]
